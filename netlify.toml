# Static export. No secrets. Netlify domain, DNS and deploy settings stay with Gor (D14).
# HSTS: Netlify adds it on *.netlify.app subdomains, not on a custom domain.
# lingumaster.app therefore sets it here. No preload.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22.23.4"
  SITE_URL = "https://lingumaster.app"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production.environment]
  SITE_URL = "https://lingumaster.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self'; font-src 'self'; style-src 'self'; connect-src 'self' https://gateway.umami.is; script-src 'self' 'sha256-jDoilTXt2672yl6/ZkU7UxAf+cNiTalm42YM1aMWaw4=' https://cloud.umami.is"
    Strict-Transport-Security = "max-age=31536000"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
